name: oc_transformer  # oc_transformer or actor_critic
separate: False
space:
  continuous:
    mu_activation: None
    sigma_activation: None
    mu_init:
      name: default
      # gain: 0.01
    value_init:
      name: default
      # gain: 1
    sigma_init:
      name: const_initializer
      val: 0
    fixed_sigma: True
mlp:
  units: [256, 256, 128]
  activation: tanh
  d2rl: False
  initializer:
    name: default
  regularizer:
    name: None

transformer: # Only used if name == oc_transformer
  emb_dim: 128
  num_heads: 8
  num_blocks: 3
  activation: relu
  dropout_prob: 0.0
  pooling_type: 'avg'  # 'max' or 'avg'